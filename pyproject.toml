[project]
name = "trackster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "kaggle>=2.2.3",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "seaborn>=0.13.2",
    "supabase>=2.31.0",
    "tqdm>=4.68.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
eda = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackster"]
